<div class="theme-switch" role="group" aria-label="Appearance">
  <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light theme"><i class="fas fa-sun" aria-hidden="true"></i></button>
  <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme"><i class="fas fa-moon" aria-hidden="true"></i></button>
</div>
