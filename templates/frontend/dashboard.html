<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ school_config.school_name }}</title>
  <script src="/static/frontend/js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/frontend/css/style.css?v=metrics2">
  <link rel="stylesheet" href="/static/frontend/css/workspace.css?v=class-timetable">
  <link rel="stylesheet" href="/static/frontend/css/theme.css">
</head>
<body>

<!-- ══ Sidebar ══ -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <i class="fas fa-graduation-cap"></i>
    <span id="schoolBrand">{{ school_config.school_name }}</span>
  </div>
  <ul class="nav flex-column mt-2 flex-grow-1" id="navMenu"></ul>
  <div style="padding:16px 24px; border-top:1px solid rgba(255,255,255,.08)">
    <button class="btn btn-sm btn-outline-secondary w-100" id="logoutBtn">
      <i class="fas fa-sign-out-alt me-2"></i>Logout
    </button>
  </div>
</nav>

<!-- ══ Main content ══ -->
<div class="main-content" id="mainContent">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <button id="sidebarToggle" aria-label="Toggle navigation" aria-controls="sidebar"><i class="fas fa-bars" aria-hidden="true"></i></button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <form id="moduleFinder" role="search"><i class="fas fa-search" aria-hidden="true"></i><input id="moduleSearch" type="search" list="moduleChoices" aria-label="Find a section" placeholder="Find a section…"><datalist id="moduleChoices"></datalist></form>
    </div>
    <div class="topbar-right">
      {% include "frontend/theme_switch.html" %}
      <div class="user-badge">
        <div class="user-avatar" id="userAvatar">?</div>
        <div>
          <div class="user-name" id="userName">Loading…</div>
          <span class="role-pill" id="rolePill"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Page content -->
  <div class="page-content" id="pageContent">
    <div class="spinner-wrap">
      <div class="spinner-border text-primary"></div>
      <span>Loading…</span>
    </div>
  </div>
</div>

<!-- ══ Generic Modal ══ -->
<div class="modal fade" id="mainModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="modalSave">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ Toast ══ -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{{ school_config.account_suffix|json_script:"schoolAccountSuffix" }}
<script src="/static/frontend/js/api.js?v=workspace2"></script>
<script src="/static/frontend/js/workspace.js?v=class-timetable"></script>
<script src="/static/frontend/js/app.js?v=workspace2"></script>
</body>
</html>
