<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — {{ school_config.school_name }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/frontend/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="fas fa-graduation-cap"></i>
      <h2>{{ school_config.school_name }}</h2>
      <p>Sign in to your account</p>
    </div>

    <div id="alert" class="alert d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold small">Email or school login ID</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
          <input type="text" id="email" class="form-control border-start-0"
                 placeholder="you@{{ school_config.account_suffix }}" required autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" id="password" class="form-control border-start-0"
                 placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="input-group-text bg-light" id="togglePwd">
            <i class="fas fa-eye text-muted" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-login w-100" id="submitBtn">
        <span id="btnText">Sign In</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.8rem">
      <i class="fas fa-shield-alt me-1"></i>School Management Platform
    </p>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('sp_token')) {
    window.location.href = '/dashboard/';
  }

  document.getElementById('togglePwd').addEventListener('click', () => {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text'; icon.className = 'fas fa-eye-slash text-muted';
    } else {
      pwd.type = 'password'; icon.className = 'fas fa-eye text-muted';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alert    = document.getElementById('alert');
    const btn      = document.getElementById('submitBtn');
    const btnText  = document.getElementById('btnText');
    const spinner  = document.getElementById('btnSpinner');

    alert.className = 'alert d-none';
    btn.disabled = true; btnText.textContent = 'Signing in…'; spinner.classList.remove('d-none');

    try {
      const res = await fetch('/api/v1/auth/login/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('sp_token',   data.access);
        localStorage.setItem('sp_refresh', data.refresh);
        localStorage.setItem('sp_user',    JSON.stringify(data.user));
        window.location.href = '/dashboard/';
      } else {
        const msg = data.detail || Object.values(data).flat().join(' ');
        alert.className = 'alert alert-danger';
        alert.textContent = msg;
      }
    } catch {
      alert.className = 'alert alert-danger';
      alert.textContent = 'Network error — please try again.';
    } finally {
      btn.disabled = false; btnText.textContent = 'Sign In'; spinner.classList.add('d-none');
    }
  });
</script>
</body>
</html>
